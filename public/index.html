<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Câmera - Início</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 20px; }
    h1 { margin-top: 40px; }
    .btn-container { display: flex; flex-direction: column; gap: 20px; max-width: 300px; margin: 50px auto; }
    .btn { padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; text-decoration: none; display: block; text-align: center; }
    .btn-monitor { background: #007bff; }
    .btn-transmissor { background: #28a745; }
    #view-monitor, #view-transmissor { display: none; }
    video, img { width: 100%; max-width: 640px; border: 2px solid #444; border-radius: 8px; margin-top: 15px; }
    .back-btn { background: #6c75d6; margin: 20px auto; max-width: 200px; }
  </style>
</head>
<body>

  <!-- MENU INICIAL -->
  <div id="view-menu">
    <h1>Escolha o Modo</h1>
    <div class="btn-container">
      <button class="btn btn-monitor" onclick="escolherModo('monitor')">Ver Monitor (Receptor)</button>
      <button class="btn btn-transmissor" onclick="escolherModo('transmissor')">Transmitir Câmera</button>
    </div>
  </div>

  <!-- TELA DO MONITOR -->
  <div id="view-monitor">
    <h2>Painel - Receptor de Câmera</h2>
    <img id="videoStream" alt="Aguardando transmissão...">
    <br>
    <button class="btn back-btn" onclick="voltarMenu()">Voltar ao Menu</button>
  </div>

  <!-- TELA DO TRANSMISSOR -->
  <div id="view-transmissor">
    <h2>Transmissão ao Vivo</h2>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="preview" style="display:none;"></canvas>
    <br>
    <button class="btn back-btn" onclick="voltarMenu()">Voltar ao Menu</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function escolherModo(modo) {
      document.getElementById('view-menu').style.display = 'none';
      if (modo === 'monitor') {
        document.getElementById('view-monitor').style.display = 'block';
        iniciarMonitor();
      } else {
        document.getElementById('view-transmissor').style.display = 'block';
        iniciarTransmissor();
      }
    }

    function voltarMenu() {
      window.location.reload(); // Recarrega para limpar câmeras e conexões ativas
    }

    // --- LÓGICA DO MONITOR ---
    function iniciarMonitor() {
      const videoStream = document.getElementById('videoStream');
      socket.on('video-frame', (image) => {
        videoStream.src = image;
      });
    }

    // --- LÓGICA DO TRANSMISSOR ---
    async function iniciarTransmissor() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('preview');
      const context = canvas.getContext('2d');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment" }, 
          audio: false 
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Erro ao acessar a câmera: " + err);
      }

      setInterval(() => {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth * 0.5; // Reduz pela metade para otimizar
          canvas.height = video.videoHeight * 0.5;
          context.drawImage(video, 0, 0, canvas.width, canvas.height);
          const data = canvas.toDataURL('image/jpeg', 0.5);
          socket.emit('video-frame', data);
        }
      }, 100); // Envia 10 quadros por segundo
    }
  </script>
</body>
</html>
