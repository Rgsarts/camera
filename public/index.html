<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel - Receptor de Câmera</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin-top: 20px; }
        img { width: 100%; max-width: 640px; border: 2px solid #444; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Câmera ao Vivo</h1>
    <img id="video-stream" alt="Aguardando transmissão..." />

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const img = document.getElementById('video-stream');

        socket.on('video-frame', (data) => {
            img.src = data;
        });
    </script>
</body>
</html>
