<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Transmissor - Câmera</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin-top: 20px; }
        video { width: 100%; max-width: 400px; border: 2px solid #444; border-radius: 8px; }
        canvas { display: none; }
    </style>
</head>
<body>
    <h1>Transmitindo Câmera</h1>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                alert('Erro ao acessar a câmera: ' + err);
            });

        setInterval(() => {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = 320;
                canvas.height = 240;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                const data = canvas.toDataURL('image/jpeg', 0.5);
                socket.emit('video-frame', data);
            }
        }, 200);
    </script>
</body>
</html>
